[project]
name = "ghost-wires"
version = "0.1.0"
description = "Cifra e decifra os enigmas dos capítulos do Ghost in the Wires."
readme = "README.md"
authors = [
    { name = "Renan", email = "renancroffi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
ghost-wires = "ghost_wires:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
